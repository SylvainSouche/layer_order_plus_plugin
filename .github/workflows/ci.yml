name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Plugin checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (zip + libegl1 for PyQt6 headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip libegl1 libgl1 libglib2.0-0 libfontconfig1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pytest ruff

      - name: Lint
        run: ruff check .

      - name: Validate metadata, VERSION, syntax, Qt6 patterns
        run: python3 scripts/check_plugin.py

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: make test

      - name: Build versioned zip
        run: |
          make show-version
          make zip
          VERSION=$(tr -d '[:space:]' < VERSION)
          test -f "dist/advanced_layer_order-${VERSION}.zip"

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: advanced_layer_order-zip
          path: dist/advanced_layer_order-*.zip
          if-no-files-found: error
