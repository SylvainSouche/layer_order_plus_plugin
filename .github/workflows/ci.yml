name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Plugin checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Validate metadata, VERSION, syntax, Qt6 patterns
        run: python3 scripts/check_plugin.py

      - name: Build versioned zip
        run: |
          make show-version
          make zip
          VERSION=$(tr -d '[:space:]' < VERSION)
          test -f "dist/layer_order_plus_qgis4-${VERSION}.zip"

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: layer_order_plus_qgis4-zip
          path: dist/layer_order_plus_qgis4-*.zip
          if-no-files-found: error
